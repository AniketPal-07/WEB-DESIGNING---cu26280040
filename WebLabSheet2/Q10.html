<!DOCTYPE html>
<html>
<head>
    <title>Data Entry Table</title>

    <style>
        .container {
            width: 600px;
            margin: 30px auto;
            padding: 20px;
            border: 1px solid gray;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            border: 1px solid gray;
            text-align: center;
        }

        th {
            background-color: lightskyblue;
            color: white;
        }

        /* Alternating row colors */
        tr:nth-child(even) {
            background-color: #eeeeee;
        }

        tr:nth-child(odd) {
            background-color: #ffffff;
        }

        /* Hover effect */
        tr:hover {
            background-color: #cce5ff;
        }

        input {
            width: 90%;
            padding: 5px;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: blue;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Student Data Entry</h2>

    <form>
        <table>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Course</th>
            </tr>

            <tr>
                <td><input type="text"></td>
                <td><input type="number"></td>
                <td><input type="text"></td>
            </tr>

            <tr>
                <td><input type="text"></td>
                <td><input type="number"></td>
                <td><input type="text"></td>
            </tr>
        </table>

        <button type="submit">Save Data</button>
    </form>

</div>

</body>
</html>
