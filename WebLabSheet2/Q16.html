<!DOCTYPE html>
<html>
<head>
    <title>Employee Evaluation</title>

    <style>
        body {
            font-family: Arial;
        }

        .form {
            width: 500px;
            margin: 30px auto;
        }

        label {
            width: 150px;
            float: left;
            margin-bottom: 15px;
        }

        input, select, textarea {
            width: 300px;
            padding: 8px;
            margin-bottom: 15px;
        }

        .clear {
            clear: both;
        }

        button {
            padding: 10px 20px;
        }
    </style>
</head>

<body>

<div class="form">
    <h2>Employee Evaluation</h2>

    <label>Employee Name:</label>
    <input type="text" placeholder="Enter name">

    <label>Department:</label>
    <input type="text" placeholder="Enter department">

    <label>Performance:</label>
    <select>
        <option>Excellent</option>
        <option>Good</option>
        <option>Average</option>
        <option>Poor</option>
    </select>

    <label>Comments:</label>
    <textarea rows="4"></textarea>

    <div class="clear"></div>

    <button>Submit Evaluation</button>
</div>

</body>
</html>
