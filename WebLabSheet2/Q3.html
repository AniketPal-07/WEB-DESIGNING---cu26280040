<!DOCTYPE html>
<html>
<head>
    <title>Frameset Layout</title>
</head>
       
<frameset rows="100px,*">
    <!-- <body style="background-color: #2563eb; color: white; text-align: center;">
    <h1>My Website</h1> -->

    <!-- Header Frame -->
    <frame src="header.html" name="header">

    <!-- Navigation + Content -->
    <frameset cols="200px,*">

        <!-- Navigation Frame -->
        <frame src="nevigation.html" name="navigation">

        <!-- Content Frame -->
        <frame src="content.html" name="content">

    </frameset>

</frameset>

</html>
