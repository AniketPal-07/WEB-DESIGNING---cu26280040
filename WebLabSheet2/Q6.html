<!DOCTYPE html>
<html>
<head>
    <title>Grid Layout</title>
    <style>
        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 500px;
            margin: 30px auto;
        }

        label {
            font-weight: bold;
        }

        input, select, textarea {
            padding: 8px;
            width: 100%;
            box-sizing: border-box;


        }

        .full {
            grid-column: 1 / 3;
        }

        button {
            padding: 10px;
            background-color: rgb(45, 45, 222);
            color: white;
            border: none;
        }
    </style>
</head>

<body>

<form>
    <div>
        <label>Name:</label>
        <input type="text">
    </div>

    <div>
        <label>Email:</label>
        <input type="email">
    </div>

    <div>
        <label>Phone:</label>
        <input type="text">
    </div>

    <div>
        <label>City:</label>
        <input type="text">
    </div>

    <div class="full">
        <label>Address:</label>
        <textarea rows="4"></textarea>
    </div>

    <div class="full">
        <button type="submit">Submit</button>
    </div>
</form>

</body>
</html>
