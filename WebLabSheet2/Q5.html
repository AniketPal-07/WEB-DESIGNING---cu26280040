<!DOCTYPE html>
<html>
<head>
  <title>Login Page</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      background: #f2f2f2;
      font-family: Arial, sans-serif;

      /* Center the card */
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-card {
      position: relative;
      width: 350px;
      padding: 40px;
      background: white;

      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
    }

    .login-card h2 {
      text-align: center;
      margin-bottom: 30px;
    }

    .input-box {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      background: #007bff;
      color: white;
      cursor: pointer;
    }

    .login-btn:hover {
      background: #0056b3;
    }

    /* Absolute positioning */
    .close {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 20px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="login-card">

    <span class="close">×</span>

    <h2>Login</h2>

    <input type="text" class="input-box" placeholder="Username">

    <input type="password" class="input-box" placeholder="Password">

    <button class="login-btn">Login</button>

  </div>

</body>
</html>
