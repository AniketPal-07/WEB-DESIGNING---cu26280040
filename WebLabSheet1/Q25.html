<!DOCTYPE html>
<html>
<head>
    <title>Survey Form</title>
</head>
<body>

    <h2>Student Survey Form</h2>

<form>
    <fieldset>
        <legend>Personal Information</legend>

        Name:
        <input type="text" name="name"><br><br>

        Email:
        <input type="email" name="email"><br><br>

        Age:
        <input type="number" name="age"><br><br>

    </fieldset>
    <br>

    <fieldset>
        <legend>Education Details</legend>

        Course:
        <select name="course">
            <option>MCA</option>
            <option>BCA</option>
            <option>B.Tech</option>
        </select>
        <br><br>

        Year:
        <input type="radio" name="year"> First
        <input type="radio" name="year"> Second
        <input type="radio" name="year"> Third
    </fieldset>

    <br>

    <fieldset>
        <legend>Feedback</legend>

        How do you rate this course?<br>

        <input type="radio" name="rating"> Excellent
        <input type="radio" name="rating"> Good
        <input type="radio" name="rating"> Average
        <br><br>

        Comments:<br>
        <textarea rows="4" cols="30"></textarea>
    </fieldset>

    <br>

    <input type="submit" value="Submit">
    <input type="reset" value="Reset">

</form>

</body>
</html>
